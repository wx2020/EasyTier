name: Sync official upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      official_branch:
        description: "Official EasyTier branch to merge"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  sync_upstream_branch:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_REPO: "https://github.com/EasyTier/EasyTier.git"
      OFFICIAL_BRANCH: ${{ github.event.inputs.official_branch || 'main' }}
      TARGET_BRANCH: "upstream"
      SAFE_FILE_THRESHOLD: "100"
    steps:
      - name: Checkout upstream branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official repository
        run: |
          git remote add official "$OFFICIAL_REPO"
          git fetch official "$OFFICIAL_BRANCH" --tags

      - name: Safety check official branch
        run: |
          OFFICIAL_REF="refs/remotes/official/$OFFICIAL_BRANCH"
          if ! git show-ref --verify --quiet "$OFFICIAL_REF"; then
            echo "Official branch not found: $OFFICIAL_BRANCH"
            exit 1
          fi

          FILE_COUNT=$(git ls-tree -r "$OFFICIAL_REF" | wc -l)
          echo "Official file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt "$SAFE_FILE_THRESHOLD" ]; then
            echo "Official file count is below safety threshold: $FILE_COUNT < $SAFE_FILE_THRESHOLD"
            exit 1
          fi

      - name: Merge official branch into upstream
        run: |
          git merge --no-edit "official/$OFFICIAL_BRANCH"

      - name: Push upstream branch and tags
        run: |
          git push origin "HEAD:$TARGET_BRANCH"
          git push origin --tags
