name: EasyTier Dev Pre-release

on:
  push:
    tags:
      - "v*-beta.*"
      - "v*-dev.*"

permissions:
  actions: read
  contents: write

concurrency:
  group: dev-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and source branch
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|dev)\.[0-9]+$ ]]; then
            echo "Pre-release tags must use vX.Y.Z-beta.N or vX.Y.Z-dev.N." >&2
            exit 1
          fi

          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$SHA" origin/dev; then
            echo "Pre-release tag $TAG must point to a commit reachable from dev." >&2
            exit 1
          fi

  core:
    needs: validate
    uses: ./.github/workflows/core.yml
    with:
      prerelease: true
    secrets: inherit

  gui:
    needs: validate
    uses: ./.github/workflows/gui.yml
    with:
      prerelease: true
    secrets: inherit

  mobile:
    needs: validate
    uses: ./.github/workflows/mobile.yml
    with:
      prerelease: true
    secrets: inherit

  publish:
    needs: [validate, core, gui, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: easytier-*
          path: release-assets

      - name: Download Magisk artifact
        uses: actions/download-artifact@v5
        with:
          name: Easytier-Magisk
          path: release-assets/Easytier-Magisk

      - name: Package artifacts
        working-directory: release-assets
        run: |
          set -euo pipefail
          rm -rf easytier-web-dashboard
          for artifact in */; do
            artifact="${artifact%/}"
            zip -qr "${artifact}.zip" "$artifact"
            rm -rf "$artifact"
          done

      - name: Generate release summary
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ "$TAG" == *-dev.* ]]; then
            pattern='v*-dev.*'
          else
            pattern='v*-beta.*'
          fi

          previous_tag=
          while IFS= read -r candidate; do
            if [[ "$candidate" != "$TAG" ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "$SHA" --sort=-version:refname --list "$pattern")

          if [[ -n "$previous_tag" ]]; then
            git log --format='- `%h` %s' "$previous_tag..$SHA" > changes.md
            compare="- Changes since: \`$previous_tag\`\n- Compare: [\`$previous_tag...$TAG\`](https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$TAG)"
          else
            git log -1 --format='- `%h` %s' "$SHA" > changes.md
            compare='- No earlier pre-release tag was found in this channel.'
          fi

          {
            printf 'body<<EOF\n'
            printf '## EasyTier %s\n\n' "$TAG"
            printf 'Development pre-release. Not recommended for production use.\n\n'
            printf '### Source\n\n'
            printf -- '- Branch: `dev`\n- Commit: [`%s`](https://github.com/%s/commit/%s)\n' "$(git rev-parse --short "$SHA")" "$GITHUB_REPOSITORY" "$SHA"
            printf '%b\n\n' "$compare"
            printf '### Included Changes\n\n'
            cat changes.md
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release-assets/*.zip
